name: Daily AI Coding News

on:
  schedule:
    # 01:17 UTC = 09:17 Asia/Shanghai. Avoid the top-of-hour Actions queue.
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ai-coding-news
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore sent links
        uses: actions/cache/restore@v5
        with:
          path: .cache/sent_links.json
          key: sent-links-${{ github.run_id }}
          restore-keys: |
            sent-links-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SENT_LINKS_PATH: .cache/sent_links.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py

      - name: Save sent links
        if: success()
        uses: actions/cache/save@v5
        with:
          path: .cache/sent_links.json
          key: sent-links-${{ github.run_id }}
